<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ogechi-portfolio</title>
    <script type="text/javascript">
      // GitHub Pages is a static host with no server-side rewrites, so a
      // direct load/refresh of a client-side route (e.g. /work/pinklady)
      // hits this 404 page. Encode the real path into a query string and
      // redirect to the SPA's index.html, which restores it on load.
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
